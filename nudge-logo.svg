<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Nudge" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B5CFF"/>
      <stop offset="1" stop-color="#2D8CFF"/>
    </linearGradient>
    <path id="cursor" d="M190 130 L190 360 L240 312 L278 396 L318 378 L280 296 L352 296 Z"/>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Echo of the previous position: suggests a small nudge -->
  <use href="#cursor" transform="translate(-40 -40)" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="12" stroke-linejoin="round"/>

  <!-- Main cursor -->
  <use href="#cursor" transform="translate(14 14)" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>
</svg>
