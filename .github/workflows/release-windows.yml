name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set release version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            "NUDGE_VERSION=${{ github.ref_name }}".TrimStart("v") >> $env:GITHUB_ENV
          } else {
            "NUDGE_VERSION=dev" >> $env:GITHUB_ENV
          }

      - name: Install dependencies
        run: >-
          python -m pip install
          aiohttp pynput pystray Pillow qrcode customtkinter pyinstaller

      - name: Build executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Nudge
          --collect-all customtkinter
          --collect-all pystray
          --collect-all pynput
          --add-data "server/client;server/client"
          --add-data "nudge-logo.svg;."
          server/main.py

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/Nudge.exe

      - name: Upload build artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Nudge-windows
          path: dist/Nudge.exe
          if-no-files-found: error
